<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Charcoal tile with a hairline frame, amber "JM" monogram — the
       portfolio's palette and wordmark at a glance. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  <text x="32" y="43" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="28" font-weight="800" letter-spacing="-1"
        fill="#e2b065">JM</text>
</svg>